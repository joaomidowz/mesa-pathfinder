<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progressão · Mesa Pathfinder</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="mesa.html"><span class="brand-title">Mesa Pathfinder</span></a><nav><a href="mesa.html">Mesa</a></nav></div></header><main class="shell"><section class="hero"><div><div class="eyebrow">Plano de evolução</div><h1>Progressão</h1><p class="cloud-status" data-cloud-status>Carregando…</p></div><div class="hero-actions"><button class="btn primary" data-save>Salvar agora</button><button class="btn" data-export>Baixar backup</button></div></section><section class="panel"><h2>Escolhas atuais</h2><div class="form-grid section-space"><label class="field">Características de ancestralidade e herança<input data-bind="feats.ancestry"></label><label class="field">Talento de ancestralidade<input data-bind="feats.ancestryTalent"></label><label class="field">Talento de perícia da biografia<input data-bind="feats.background"></label><label class="field">Talento de classe — nível 1<input data-bind="feats.class1"></label><label class="field">Talento de classe — nível 2<input data-bind="feats.class2"></label><label class="field">Talento de perícia — nível 2<input data-bind="feats.skill2"></label><label class="field">Dedicação / arquétipo<input data-bind="feats.archetype"></label></div></section><section class="panel section-space"><h2>Do nível 1 ao 20</h2><p class="muted">Planejamento livre; tipos de ganho variam conforme a classe e as regras da mesa.</p><div class="grid" id="level-plans"></div></section><div class="save-bar"><button class="btn primary" data-save>Salvar progressão <span data-save-status></span></button></div></main><script>document.getElementById('level-plans').innerHTML=Array.from({length:20},(_,i)=>`<details class="level-plan"><summary>Nível ${i+1}</summary><div class="form-grid section-space"><label>Classe / arquétipo<input data-save-key="level${i+1}-class"></label><label>Perícia<input data-save-key="level${i+1}-skill"></label><label class="field full">Outros ganhos e observações<textarea data-save-key="level${i+1}-notes"></textarea></label></div></details>`).join('');</script><script src="app.js"></script></body></html>
