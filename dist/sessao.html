<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessão · Mesa Pathfinder</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="sessao.css"></head>
<body><header class="topbar"><div class="shell topbar-inner"><a class="brand" href="mesa.html"><span class="brand-mark"><span>ᚠ</span></span><span><span class="brand-title">Mesa Pathfinder</span><br><span class="brand-sub">ficha de sessão</span></span></a><nav><a href="mesa.html">Mesa</a></nav></div></header>

</div>
</div>
